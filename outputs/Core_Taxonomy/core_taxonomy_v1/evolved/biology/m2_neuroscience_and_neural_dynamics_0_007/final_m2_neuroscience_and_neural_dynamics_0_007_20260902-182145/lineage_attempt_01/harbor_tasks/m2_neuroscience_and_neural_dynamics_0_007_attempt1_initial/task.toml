version = "1.0"

[metadata]
author_name = "Hubert linhong"
author_email = "2301213112@pku.edu.cn"
difficulty = "hard"                    # easy / medium / hard
category = "symbolic_regression"
tags = ["symbolic_regression", "biology", "srbench"]
custom_docker_compose = false

[verifier]
timeout_sec = 600.0                      # 验证器超时时间（秒）

[agent]
timeout_sec = 3600.0                     # Agent 解题超时时间（秒）— 1小时

[environment]
build_timeout_sec = 400.0                # Docker 构建超时（秒）
cpus = 1                                 # CPU 核数
memory_mb = 2048                         # 内存限制（MB）
storage_mb = 4096                        # 存储限制（MB）
