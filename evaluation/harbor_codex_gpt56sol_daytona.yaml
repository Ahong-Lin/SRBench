# Run from the llm-srbench-v7 repository root. Validated with Harbor 0.16.1.
jobs_dir: outputs/bio_phys_30_gpt56sol/04_evaluations
n_attempts: 1
n_concurrent_trials: 2
environment:
  type: daytona
  delete: true
  kwargs:
    auto_snapshot: true
    auto_delete_interval_mins: 0
agents:
  - name: codex
    model_name: gpt-5.6-sol
    kwargs:
      version: "0.131.0"
      reasoning_effort: high
      web_search: disabled
    env:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
datasets:
  - path: outputs/bio_phys_30_gpt56sol/02_packaged/harbor_dataset
artifacts:
  - /app/law.py
  - /app/explain.md
