[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "srbench-v7"
version = "7.0.0"
description = "Mechanism-guided equation evolution, Harbor packaging and law comparison"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24", "scipy>=1.10", "sympy>=1.12", "pandas>=2",
  "matplotlib>=3.7", "pydantic>=2.7", "anthropic>=0.40",
  "httpx>=0.27", "openpyxl>=3.1",
]

[project.optional-dependencies]
agent = ["claude-agent-sdk"]
daytona = ["daytona>=0.214.0,<0.215"]
dev = ["pytest>=8", "PyYAML>=6"]

[project.scripts]
srbench = "srbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
srbench = ["resources/**/*.json", "resources/**/*.jsonl", "packaging/template/**/*"]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.pyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
